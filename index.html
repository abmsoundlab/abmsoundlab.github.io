<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"

    <meta name="color-scheme" content="dark light">

        rel="icon"

    <style>

        /* =========================
           BASE
           ========================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Helvetica, sans-serif;
            background-color: #fff;
            color: #000;
        }


        /* =========================
           MAIN CONTENT
           ========================= */

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }


        /* =========================
           EMAIL BUTTON
           ========================= */

        .email-btn {
            display: inline-block;
            margin-bottom: 30px;
            padding: 8px 14px;
            cursor: pointer;
            font-family: Helvetica, sans-serif;
            text-decoration: none;
            border-radius: 4px;
            transition:
                background 0.15s ease,
                border-color 0.15s ease;
        }


        /* =========================
           TRACKS
           ========================= */

        .track {
            width: 100%;
            margin-bottom: 28px;
        }

        .track-name {
            margin-bottom: 7px;
            line-height: 1.3;
        }

        audio {
            display: block;
            width: 100%;
            height: 40px;
            color-scheme: light dark;
        }


        /* =========================
           DOWNLOAD BUTTON
           ========================= */

        .download-btn {
            display: block;
            margin-top: 8px;
            padding: 5px 10px;
            cursor: pointer;
            font-family: Helvetica, sans-serif;
        }


        /* =========================
           SOUNDCLOUD
           ========================= */

        .soundcloud {
            width: 100%;
            margin: 0 0 28px 0;
            padding: 0;
            background: #000;
        }

        .soundcloud iframe {
            display: block;
            width: 100%;
            height: 166px;
            border: 0;
        }


        /* =========================
           PASSWORD POPUP
           ========================= */

        #passwordOverlay {
            display: none;
            position: fixed;
            inset: 0;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            cursor: pointer;
        }

        #passwordBox {
            width: 280px;
            padding: 20px;
            cursor: default;
        }

        #passwordBox input {
            width: 100%;
            box-sizing: border-box;
            margin: 10px 0;
            padding: 8px;
        }

        #passwordBox button {
            padding: 8px 14px;
            cursor: pointer;
            font-family: Helvetica, sans-serif;
        }

        #passwordError {
            display: none;
            margin-top: 8px;
            font-size: 13px;
        }


        /* =========================
           DARK MODE
           ========================= */

        @media (prefers-color-scheme: dark) {

            body {
                background-color: #000;
                color: #fff;
            }

            audio {
                color-scheme: dark;
            }

            .email-btn {
                background: #222;
                color: #fff;
                border: 1px solid #555;
            }

            .email-btn:hover {
                background: #333;
                border-color: #777;
            }

            .download-btn {
                background: #222;
                color: #fff;
                border: 1px solid #555;
            }

            .download-btn:hover {
                background: #333;
            }

            .soundcloud {
                background: #000;
            }

            #passwordOverlay {
                background: rgba(0, 0, 0, 0.8);
            }

            #passwordBox {
                background: #111;
                color: #fff;
                border: 1px solid #444;
            }

            #passwordBox input {
                background: #222;
                color: #fff;
                border: 1px solid #555;
            }

            #passwordBox button {
                background: #222;
                color: #fff;
                border: 1px solid #555;
            }

            #passwordBox button:hover {
                background: #333;
            }

            #passwordError {
                color: #ff6666;
            }
        }


        /* =========================
           LIGHT MODE
           ========================= */

        @media (prefers-color-scheme: light) {

            body {
                background-color: #fff;
                color: #000;
            }

            audio {
                color-scheme: light;
            }

            .email-btn {
                background: #eee;
                color: #000;
                border: 1px solid #aaa;
            }

            .email-btn:hover {
                background: #ddd;
                border-color: #888;
            }

            .download-btn {
                background: #eee;
                color: #000;
                border: 1px solid #aaa;
            }

            .download-btn:hover {
                background: #ddd;
            }

            .soundcloud {
                background: #fff;
            }

            #passwordOverlay {
                background: rgba(255, 255, 255, 0.8);
            }

            #passwordBox {
                background: #fff;
                color: #000;
                border: 1px solid #aaa;
            }

            #passwordBox input {
                background: #fff;
                color: #000;
                border: 1px solid #aaa;
            }

            #passwordBox button {
                background: #eee;
                color: #000;
                border: 1px solid #aaa;
            }

            #passwordBox button:hover {
                background: #ddd;
            }

            #passwordError {
                color: #cc0000;
            }
        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 600px) {

            .container {
                padding: 12px;
            }

            .email-btn {
                margin-bottom: 24px;
            }

            .track {
                margin-bottom: 24px;
            }

            .soundcloud {
                margin-bottom: 24px;
            }
        }

    </style>
</head>

    <!-- =========================
         PASSWORD POPUP
         ========================= -->

    <div id="passwordOverlay">

        <div id="passwordBox">

            <div>
                Enter password to download:
            </div>

            <input
                type="password"
                id="passwordInput"
                placeholder="Password"
                autocomplete="off"
            >

            <button onclick="checkPassword()">
                Download
            </button>

            <div id="passwordError">
                Incorrect password.
            </div>

        </div>

    </div>


    <script>

        // =========================
        // PASSWORD
        // =========================

        const DOWNLOAD_PASSWORD = "feketecartel";

        let requestedFile = null;


        // =========================
        // DISABLE RIGHT-CLICK
        // ON AUDIO PLAYERS
        // =========================

        document.querySelectorAll("audio").forEach(audio => {

            audio.addEventListener("contextmenu", function(event) {
                event.preventDefault();
            });

        });


        // =========================
        // ONLY ONE AUDIO PLAYER
        // CAN PLAY AT ONCE
        // =========================

        document.querySelectorAll("audio").forEach(player => {

            player.addEventListener("play", function() {

                document.querySelectorAll("audio").forEach(otherPlayer => {

                    if (otherPlayer !== player) {
                        otherPlayer.pause();
                    }

                });

            });

        });


        // =========================
        // OPEN PASSWORD POPUP
        // =========================

        function requestDownload(filename) {

            requestedFile = filename;

            document.getElementById("passwordOverlay").style.display = "flex";

            document.getElementById("passwordInput").value = "";

            document.getElementById("passwordError").style.display = "none";

            document.getElementById("passwordInput").focus();

        }


        // =========================
        // CHECK PASSWORD
        // =========================

        function checkPassword() {

            const password =
                document.getElementById("passwordInput").value;

            if (password === DOWNLOAD_PASSWORD) {

                const link = document.createElement("a");

                link.href = requestedFile;

                link.download = requestedFile;

                document.body.appendChild(link);

                link.click();

                document.body.removeChild(link);

                closePasswordBox();

            } else {

                document.getElementById("passwordError").style.display = "block";

            }

        }


        // =========================
        // CLOSE PASSWORD POPUP
        // =========================

        function closePasswordBox() {

            document.getElementById("passwordOverlay").style.display = "none";

            requestedFile = null;

        }


        // =========================
        // CLICK / TAP OUTSIDE POPUP
        // TO CLOSE IT
        // =========================

        document
            .getElementById("passwordOverlay")
            .addEventListener("click", function(event) {

                if (event.target === this) {
                    closePasswordBox();
                }

            });


        // =========================
        // ENTER = SUBMIT
        // ESCAPE = CLOSE
        // =========================

        document
            .getElementById("passwordInput")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {
                    checkPassword();
                }

                if (event.key === "Escape") {
                    closePasswordBox();
                }

            });

    </script>
