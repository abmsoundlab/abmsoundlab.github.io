<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>ABM Soundlab</title>

    <link rel="icon" type="image/x-icon" href="https://i.ibb.co/3wW9f3h/favicon-32x32.png">

    <style>
        body {
            font-family: Helvetica, sans-serif;
            background-color: black;
            color: white;
        }

        .track {
            margin-bottom: 20px;
        }

        .track-name {
            margin-bottom: 5px;
        }

        audio {
            width: 100%;
            max-width: 500px;
        }

        .download-btn {
            display: block;
            margin-top: 6px;
            padding: 5px 10px;
            background: #222;
            color: white;
            border: 1px solid #555;
            cursor: pointer;
            font-family: Helvetica, sans-serif;
        }

        .download-btn:hover {
            background: #333;
        }

        /* Password popup */
        #passwordOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        #passwordBox {
            background: #111;
            border: 1px solid #444;
            padding: 20px;
            width: 280px;
        }

        #passwordBox input {
            width: 100%;
            box-sizing: border-box;
            margin: 10px 0;
            padding: 8px;
            background: #222;
            color: white;
            border: 1px solid #555;
        }

        #passwordBox button {
            padding: 7px 12px;
            background: #222;
            color: white;
            border: 1px solid #555;
            cursor: pointer;
        }

        #passwordError {
            color: #ff6666;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }
    </style>
</head>

<body>

    <div class="track">
        <div class="track-name">143_synthpunk.mp3</div>

        <audio controls controlsList="nodownload">
            <source src="143_synthpunk.mp3" type="audio/mpeg">
            Your browser does not support audio.
        </audio>

        <button class="download-btn" onclick="requestDownload('143_synthpunk.mp3')">
            Download
        </button>
    </div>


    <div class="track">
        <div class="track-name">152_grime.mp3</div>

        <audio controls controlsList="nodownload">
            <source src="152_grime.mp3" type="audio/mpeg">
            Your browser does not support audio.
        </audio>

        <button class="download-btn" onclick="requestDownload('152_grime.mp3')">
            Download
        </button>
    </div>


    <div class="track">
        <div class="track-name">162_grime.mp3</div>

        <audio controls controlsList="nodownload">
            <source src="162_grime.mp3" type="audio/mpeg">
            Your browser does not support audio.
        </audio>

        <button class="download-btn" onclick="requestDownload('162_grime.mp3')">
            Download
        </button>
    </div>


    <div class="track">
        <div class="track-name">221_dancehall_(no_4mat_no_fear_sample).mp3</div>

        <audio controls controlsList="nodownload">
            <source src="221_dancehall_(no_4mat_no_fear_sample).mp3" type="audio/mpeg">
            Your browser does not support audio.
        </audio>

        <button class="download-btn" onclick="requestDownload('221_dancehall_(no_4mat_no_fear_sample).mp3')">
            Download
        </button>
    </div>


    <div class="track">
        <div class="track-name">262_grime.mp3</div>

        <audio controls controlsList="nodownload">
            <source src="262_grime.mp3" type="audio/mpeg">
            Your browser does not support audio.
        </audio>

        <button class="download-btn" onclick="requestDownload('262_grime.mp3')">
            Download
        </button>
    </div>


    <div class="track">
        <div class="track-name">313_liquid_808.mp3</div>

        <audio controls controlsList="nodownload">
            <source src="313_liquid_808.mp3" type="audio/mpeg">
            Your browser does not support audio.
        </audio>

        <button class="download-btn" onclick="requestDownload('313_liquid_808.mp3')">
            Download
        </button>
    </div>


    <p>
        <iframe
            width="100%"
            height="166"
            scrolling="no"
            frameborder="no"
            allow="autoplay"
            src="https://w.soundcloud.com/player/?url=https://soundcloud.com/sudety/zwei-karen-wixen-super?">
        </iframe>
    </p>

    <p>
        <iframe
            width="100%"
            height="166"
            scrolling="no"
            frameborder="no"
            allow="autoplay"
            src="https://w.soundcloud.com/player/?url=https://soundcloud.com/sudety/surstroemming?">
        </iframe>
    </p>


    <!-- Password popup -->

    <div id="passwordOverlay">

        <div id="passwordBox">

            <div>Enter password to download:</div>

            <input
                type="password"
                id="passwordInput"
                placeholder="Password"
                autocomplete="off"
            >

            <button onclick="checkPassword()">Download</button>

            <div id="passwordError">
                Incorrect password.
            </div>

        </div>

    </div>


    <script>

        const DOWNLOAD_PASSWORD = "feketecartel";

        let requestedFile = null;
        
        document.querySelectorAll("audio").forEach(audio => {
    audio.addEventListener("contextmenu", function(event) {
        event.preventDefault();
    });
});

        document.querySelectorAll("audio").forEach(player => {
    player.addEventListener("play", function() {
        document.querySelectorAll("audio").forEach(otherPlayer => {
            if (otherPlayer !== player) {
                otherPlayer.pause();
            }
        });
    });
});

        function requestDownload(filename) {

            requestedFile = filename;

            document.getElementById("passwordOverlay").style.display = "flex";

            document.getElementById("passwordInput").value = "";

            document.getElementById("passwordError").style.display = "none";

            document.getElementById("passwordInput").focus();
        }


        function checkPassword() {

            const password =
                document.getElementById("passwordInput").value;

            if (password === DOWNLOAD_PASSWORD) {

                const link = document.createElement("a");

                link.href = requestedFile;

                link.download = requestedFile;

                document.body.appendChild(link);

                link.click();

                document.body.removeChild(link);

                closePasswordBox();

            } else {

                document.getElementById("passwordError").style.display = "block";

            }
        }


        function closePasswordBox() {

            document.getElementById("passwordOverlay").style.display = "none";

            requestedFile = null;
        }


        // Pressing Enter submits the password
        document.getElementById("passwordInput").addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                checkPassword();
            }

            if (event.key === "Escape") {
                closePasswordBox();
            }

        });

    </script>

</body>
</html>
