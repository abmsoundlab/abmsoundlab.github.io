<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="color-scheme" content="dark light">

    <title>ABM Soundlab</title>

    <link rel="icon" type="image/x-icon" href="https://i.ibb.co/cX1mVCBw/favicon-32x32.png">

    <style>

        body {
            font-family: Helvetica, sans-serif;
            margin: 8px;
        }

        .track {
            margin-bottom: 20px;
        }

        .track-name {
            margin-bottom: 5px;
        }

        audio {
            width: 100%;
            max-width: 500px;
            color-scheme: light dark;
        }

        @media (prefers-color-scheme: light) {
            audio {
                color-scheme: light;
            }
        }

        @media (prefers-color-scheme: dark) {
            audio {
                color-scheme: dark;
            }
        }


        /* =========================
           EMAIL BUTTON
           ========================= */

        .email-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 8px 14px;
            cursor: pointer;
            font-family: Helvetica, sans-serif;
            text-decoration: none;
            border-radius: 4px;
            transition: background 0.15s ease, border-color 0.15s ease;
        }


        /* =========================
           DOWNLOAD BUTTON
           ========================= */

        .download-btn {
            display: block;
            margin-top: 6px;
            padding: 5px 10px;
            cursor: pointer;
            font-family: Helvetica, sans-serif;
        }


        /* =========================
           PASSWORD POPUP
           ========================= */

        #passwordOverlay {
            display: none;
            position: fixed;
            inset: 0;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            cursor: pointer;
        }

        #passwordBox {
            padding: 20px;
            width: 280px;
            cursor: default;
        }

        #passwordBox input {
            width: 100%;
            box-sizing: border-box;
            margin: 10px 0;
            padding: 8px;
        }

        #passwordBox button {
            padding: 8px 14px;
            cursor: pointer;
            font-family: Helvetica, sans-serif;
        }

        #passwordError {
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }


        /* =========================
           DARK MODE
           ========================= */

        @media (prefers-color-scheme: dark) {

            body {
                background-color: #000;
                color: #fff;
            }

            .email-btn {
                background: #222;
                color: #fff;
                border: 1px solid #555;
            }

            .email-btn:hover {
                background: #333;
                border-color: #777;
            }

            .download-btn {
                background: #222;
                color: #fff;
                border: 1px solid #555;
            }

            .download-btn:hover {
                background: #333;
            }

            #passwordOverlay {
                background: rgba(0, 0, 0, 0.8);
            }

            #passwordBox {
                background: #111;
                color: #fff;
                border: 1px solid #444;
            }

            #passwordBox input {
                background: #222;
                color: #fff;
                border: 1px solid #555;
            }

            #passwordBox button {
                background: #222;
                color: #fff;
                border: 1px solid #555;
            }

            #passwordBox button:hover {
                background: #333;
            }

            #passwordError {
                color: #ff6666;
            }
        }


        /* =========================
           LIGHT MODE
           ========================= */

        @media (prefers-color-scheme: light) {

            body {
                background-color: #fff;
                color: #000;
            }

            .email-btn {
                background: #eee;
                color: #000;
                border: 1px solid #aaa;
            }

            .email-btn:hover {
                background: #ddd;
                border-color: #888;
            }

            .download-btn {
                background: #eee;
                color: #000;
                border: 1px solid #aaa;
            }

            .download-btn:hover {
                background: #ddd;
            }

            #passwordOverlay {
                background: rgba(255, 255, 255, 0.8);
            }

            #passwordBox {
                background: #fff;
                color: #000;
                border: 1px solid #aaa;
            }

            #passwordBox input {
                background: #fff;
                color: #000;
                border: 1px solid #aaa;
            }

            #passwordBox button {
                background: #eee;
                color: #000;
                border: 1px solid #aaa;
            }

            #passwordBox button:hover {
                background: #ddd;
            }

            #passwordError {
                color: #cc0000;
            }
        }

    </style>
</head>


<body>


    <!-- Email -->

    <a class="email-btn" href="mailto:abm.soundlab@gmail.com">
        abm.soundlab@gmail.com
    </a>


    <!-- Tracks -->

    <div class="track">
        <div class="track-name">dancehall beat 108 bpm (no_4mat no fear sample)</div>

        <audio controls controlsList="nodownload">
            <source src="ABM_108_Emin_dancehall.mp3" type="audio/mpeg">
            Your browser does not support audio.
        </audio>

        <button class="download-btn" onclick="requestDownload('https://github.com/abmsoundlab/abmsoundlab.github.io/releases/download/audio-v1/ABM_108_Emin_dancehall.wav')">
            Download
        </button>
    </div>

   
    <div class="track">
        <div class="track-name">Chief Keef type beat 145 bpm</div>

        <audio controls controlsList="nodownload">
            <source src="ABM_145_Fmin_chief_keef.mp3" type="audio/mpeg">
            Your browser does not support audio.
        </audio>

        <button class="download-btn" onclick="requestDownload('https://github.com/abmsoundlab/abmsoundlab.github.io/releases/download/audio-v1/ABM_145_Fmin_chief_keef.wav')">
            Download
        </button>
    </div>


    <div class="track">
        <div class="track-name">Chief Keef type beat 155 bpm</div>

        <audio controls controlsList="nodownload">
            <source src="ABM_155_Abmin_chief_keef.mp3" type="audio/mpeg">
            Your browser does not support audio.
        </audio>

        <button class="download-btn" onclick="requestDownload('https://github.com/abmsoundlab/abmsoundlab.github.io/releases/download/audio-v1/ABM_155_Abmin_chief_keef.wav')">
            Download
        </button>
    </div>
    

     <div class="track">
        <div class="track-name">synthpunk [demo]</div>

        <audio controls controlsList="nodownload">
            <source src="143_synthpunk.mp3" type="audio/mpeg">
            Your browser does not support audio.
        </audio>
    </div>

     <div class="track">
        <div class="track-name">liquid with 808 drum machine [demo]</div>

        <audio controls controlsList="nodownload">
            <source src="313_liquid_808.mp3" type="audio/mpeg">
            Your browser does not support audio.
        </audio>
    </div>
    

    <!-- SoundCloud players -->

<p>
    <iframe
        width="100%"
        height="166"
        scrolling="no"
        frameborder="no"
        allow="autoplay"
        src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%253Atracks%253A2339584835">
    </iframe>
</p>

<p>
    <iframe
        width="100%"
        height="166"
        scrolling="no"
        frameborder="no"
        allow="autoplay"
        src="https://w.soundcloud.com/player/?url=https://soundcloud.com/sudety/zwei-karen-wixen-super">
    </iframe>
</p>

<p>
    <iframe
        width="100%"
        height="166"
        scrolling="no"
        frameborder="no"
        allow="autoplay"
        src="https://w.soundcloud.com/player/?url=https://soundcloud.com/sudety/surstroemming">
    </iframe>
</p>

    <!-- Password popup -->

    <div id="passwordOverlay">

        <div id="passwordBox">

            <div>Enter password to download:</div>

            <input
                type="password"
                id="passwordInput"
                placeholder="Password"
                autocomplete="off"
            >

            <button onclick="checkPassword()">
                Download
            </button>

            <div id="passwordError">
                Incorrect password.
            </div>

        </div>

    </div>


    <script>

        // =========================
        // PASSWORD
        // =========================

        const DOWNLOAD_PASSWORD = "feketecartel";

        let requestedFile = null;


        // =========================
        // DISABLE RIGHT-CLICK
        // ON AUDIO PLAYERS
        // =========================

        document.querySelectorAll("audio").forEach(audio => {

            audio.addEventListener("contextmenu", function(event) {
                event.preventDefault();
            });

        });


        // =========================
        // ONLY ONE AUDIO PLAYER
        // CAN PLAY AT ONCE
        // =========================

        document.querySelectorAll("audio").forEach(player => {

            player.addEventListener("play", function() {

                document.querySelectorAll("audio").forEach(otherPlayer => {

                    if (otherPlayer !== player) {
                        otherPlayer.pause();
                    }

                });

            });

        });


        // =========================
        // OPEN PASSWORD POPUP
        // =========================

        function requestDownload(filename) {

            requestedFile = filename;

            document.getElementById("passwordOverlay").style.display = "flex";

            document.getElementById("passwordInput").value = "";

            document.getElementById("passwordError").style.display = "none";

            document.getElementById("passwordInput").focus();

        }


        // =========================
        // CHECK PASSWORD
        // =========================

        function checkPassword() {

            const password =
                document.getElementById("passwordInput").value;

            if (password === DOWNLOAD_PASSWORD) {

                const link = document.createElement("a");

                link.href = requestedFile;

                link.download = requestedFile;

                document.body.appendChild(link);

                link.click();

                document.body.removeChild(link);

                closePasswordBox();

            } else {

                document.getElementById("passwordError").style.display = "block";

            }

        }


        // =========================
        // CLOSE PASSWORD POPUP
        // =========================

        function closePasswordBox() {

            document.getElementById("passwordOverlay").style.display = "none";

            requestedFile = null;

        }


        // =========================
        // CLICK / TAP OUTSIDE POPUP
        // TO CLOSE IT
        // =========================

        document.getElementById("passwordOverlay").addEventListener("click", function(event) {

            if (event.target === this) {
                closePasswordBox();
            }

        });


        // =========================
        // ENTER = SUBMIT
        // ESCAPE = CLOSE
        // =========================

        document.getElementById("passwordInput").addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                checkPassword();
            }

            if (event.key === "Escape") {
                closePasswordBox();
            }

        });

    </script>

</body>
</html>
