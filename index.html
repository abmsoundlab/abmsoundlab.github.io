<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="color-scheme" content="dark light">

    <title>ABM Soundlab</title>

    <link
        rel="icon"
        type="image/x-icon"
        href="https://i.ibb.co/0pbVzZT8/favicon-32x32.png"
    >


    <style>

        /* ==================================================
           RESET
           ================================================== */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            margin: 0;
            padding: 0;
            background: #f5f5f3;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 14px;
            line-height: 1.4;
            background: #f5f5f3;
            color: #111;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }


        /* ==================================================
           PAGE
           ================================================== */

        .container {
            width: 100%;
            max-width: 780px;
            margin: 0 auto;
            padding: 42px 24px 70px;
        }


        /* ==================================================
           HEADER
           ================================================== */

        .header {
            margin-bottom: 58px;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .logo {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.08em;
            line-height: 1;
        }


        /* ==================================================
           SOCIAL ICONS
           ================================================== */

        .social-links {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            color: #888;
            text-decoration: none;
            transition:
                color 0.15s ease,
                transform 0.15s ease;
        }

        .social-link:hover {
            color: #111;
            transform: translateY(-1px);
        }

        .social-link svg {
            display: block;
            width: 18px;
            height: 18px;
            fill: currentColor;
        }


        /* ==================================================
           SECTIONS
           ================================================== */

        .section {
            margin-bottom: 58px;
        }

        .section:last-child {
            margin-bottom: 0;
        }

        .section-label {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            color: #888;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .section-label::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #ddd;
        }


        /* ==================================================
           LOCAL TRACKS
           ================================================== */

        .track {
            margin-bottom: 30px;
        }

        .track:last-child {
            margin-bottom: 0;
        }

        .track-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 8px;
        }

        .track-name {
            min-width: 0;
            color: inherit;
            font-size: 14px;
            line-height: 1.35;
        }

        .track-meta {
            flex-shrink: 0;
            color: #999;
            font-size: 11px;
            white-space: nowrap;
        }


        /* ==================================================
           AUDIO
           ================================================== */

        audio {
            display: block;
            width: 100%;
            height: 40px;
        }


        /* ==================================================
           DOWNLOAD
           ================================================== */

        .download-btn {
            display: inline-flex;
            align-items: center;
            margin-top: 8px;
            padding: 5px 9px;
            border: 1px solid #ccc;
            border-radius: 3px;
            background: transparent;
            color: #666;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 11px;
            line-height: 1;
            cursor: pointer;
            transition:
                color 0.15s ease,
                border-color 0.15s ease,
                background 0.15s ease;
        }

        .download-btn:hover {
            background: #eaeae8;
            border-color: #aaa;
            color: #111;
        }


        /* ==================================================
           SOUNDCLOUD
           ================================================== */

        .soundcloud-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .soundcloud {
            width: 100%;
            overflow: hidden;
            background: #000;
            border-radius: 2px;
        }

        .soundcloud iframe {
            display: block;
            width: 100%;
            height: 166px;
            border: 0;
        }


        /* ==================================================
           PASSWORD POPUP
           ================================================== */

        #passwordOverlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(245, 245, 243, 0.88);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            cursor: pointer;
        }

        #passwordBox {
            width: 100%;
            max-width: 320px;
            padding: 24px;
            background: #fff;
            border: 1px solid #d5d5d2;
            border-radius: 4px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
            cursor: default;
        }

        .password-title {
            margin-bottom: 4px;
            font-size: 14px;
            font-weight: 600;
        }

        .password-description {
            margin-bottom: 16px;
            color: #888;
            font-size: 12px;
        }

        #passwordBox input {
            display: block;
            width: 100%;
            height: 38px;
            margin: 0 0 10px;
            padding: 0 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
            outline: none;
            background: #fff;
            color: #111;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 13px;
        }

        #passwordBox input:focus {
            border-color: #888;
        }

        #passwordBox button {
            width: 100%;
            height: 38px;
            border: 1px solid #111;
            border-radius: 3px;
            background: #111;
            color: #fff;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        #passwordBox button:hover {
            background: #333;
        }

        #passwordError {
            display: none;
            margin-top: 10px;
            color: #c00;
            font-size: 12px;
        }


        /* ==================================================
           DARK MODE
           ================================================== */

        @media (prefers-color-scheme: dark) {

            html {
                background: #0a0a0a;
            }

            body {
                background: #0a0a0a;
                color: #f2f2f2;
            }

            .social-link {
                color: #777;
            }

            .social-link:hover {
                color: #fff;
            }

            .section-label {
                color: #666;
            }

            .section-label::after {
                background: #282828;
            }

            .track-meta {
                color: #666;
            }

            .download-btn {
                border-color: #3a3a3a;
                color: #999;
            }

            .download-btn:hover {
                background: #1b1b1b;
                border-color: #555;
                color: #fff;
            }

            .soundcloud {
                background: #000;
            }

            #passwordOverlay {
                background: rgba(0, 0, 0, 0.82);
            }

            #passwordBox {
                background: #111;
                border-color: #333;
                box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            }

            .password-description {
                color: #777;
            }

            #passwordBox input {
                background: #1b1b1b;
                color: #fff;
                border-color: #444;
            }

            #passwordBox input:focus {
                border-color: #777;
            }

            #passwordBox button {
                background: #eee;
                color: #111;
                border-color: #eee;
            }

            #passwordBox button:hover {
                background: #fff;
            }

            #passwordError {
                color: #ff6666;
            }

        }


        /* ==================================================
           MOBILE
           ================================================== */

        @media (max-width: 600px) {

            .container {
                padding: 28px 16px 50px;
            }

            .header {
                margin-bottom: 42px;
            }

            .header-top {
                gap: 16px;
            }

            .social-links {
                gap: 10px;
            }

            .social-link,
            .social-link svg {
                width: 17px;
                height: 17px;
            }

            .section {
                margin-bottom: 46px;
            }

                margin-bottom: 16px;
            }

            .track {

            }

                display: block;
                margin-bottom: 7px;
            }

            .track-meta {
                display: block;
                margin-top: 2px;
            }

            .soundcloud-list {
                gap: 14px;
            }

        }

    </style>

</head>

<!-- ==================================================
     PASSWORD POPUP
     ================================================== -->

<div id="passwordOverlay">

    <div id="passwordBox">

        <div class="password-title">
            Download WAV
        </div>

        <div class="password-description">
            Enter the password to download this file.
        </div>

        <input
            type="password"
            id="passwordInput"
            placeholder="Password"
            autocomplete="off"
        >

        <button onclick="checkPassword()">
            Download
        </button>

        <div id="passwordError">
            Incorrect password.
        </div>

    </div>

</div>


<script>


    /* ==================================================
       PASSWORD
       ================================================== */

    const DOWNLOAD_PASSWORD = "feketecartel";

    let requestedFile = null;


    /* ==================================================
       DISABLE RIGHT-CLICK
       ON AUDIO PLAYERS
       ================================================== */

    document
        .querySelectorAll("audio")
        .forEach(audio => {

            audio.addEventListener(
                "contextmenu",
                function(event) {
                    event.preventDefault();
                }
            );

        });


    /* ==================================================
       ONLY ONE LOCAL AUDIO PLAYER
       CAN PLAY AT ONCE
       ================================================== */

    document
        .querySelectorAll("audio")
        .forEach(player => {

            player.addEventListener(
                "play",
                function() {

                    document
                        .querySelectorAll("audio")
                        .forEach(otherPlayer => {

                            if (otherPlayer !== player) {
                                otherPlayer.pause();
                            }

                        });

                }
            );

        });


    /* ==================================================
       OPEN PASSWORD POPUP
       ================================================== */

    function requestDownload(filename) {

        requestedFile = filename;

        const overlay =
            document.getElementById("passwordOverlay");

        const input =
            document.getElementById("passwordInput");

        const error =
            document.getElementById("passwordError");

        overlay.style.display = "flex";

        input.value = "";

        error.style.display = "none";

        input.focus();

    }


    /* ==================================================
       CHECK PASSWORD
       ================================================== */

    function checkPassword() {

        const password =
            document.getElementById("passwordInput").value;

        if (password === DOWNLOAD_PASSWORD) {

            const link =
                document.createElement("a");

            link.href = requestedFile;

            link.download = requestedFile;

            document.body.appendChild(link);

            link.click();

            document.body.removeChild(link);

            closePasswordBox();

        } else {

            document.getElementById(
                "passwordError"
            ).style.display = "block";

        }

    }


    /* ==================================================
       CLOSE PASSWORD POPUP
       ================================================== */

    function closePasswordBox() {

        document.getElementById(
            "passwordOverlay"
        ).style.display = "none";

        requestedFile = null;

    }


    /* ==================================================
       CLICK OUTSIDE POPUP TO CLOSE
       ================================================== */

    document
        .getElementById("passwordOverlay")
        .addEventListener(
            "click",
            function(event) {

                if (event.target === this) {
                    closePasswordBox();
                }

            }
        );


    /* ==================================================
       ENTER = SUBMIT
       ESCAPE = CLOSE
       ================================================== */

    document
        .getElementById("passwordInput")
        .addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {
                    checkPassword();
                }

                if (event.key === "Escape") {
                    closePasswordBox();
                }

            }
        );

</script>
